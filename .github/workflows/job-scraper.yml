name: JOBPOYT Job Scraper

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

concurrency:
  group: jobpoyt-job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Scrape continuously for 30 minutes
        timeout-minutes: 31
        run: |
          window_seconds=1800
          deadline=$((SECONDS + window_seconds))
          cycle=0

          while (( SECONDS < deadline )); do
            cycle=$((cycle + 1))
            remaining=$((deadline - SECONDS))
            echo "Starting scraper cycle ${cycle}; ${remaining}s remain in the scraping window"

            set +e
            timeout --signal=TERM --kill-after=2s "${remaining}s" npm start
            status=$?
            set -e

            if (( status == 124 && SECONDS >= deadline )); then
              echo "30-minute scraping window completed"
              break
            fi

            if (( status != 0 )); then
              exit "$status"
            fi
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
