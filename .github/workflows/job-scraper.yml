name: JOBPOYT Job Scraper

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

concurrency:
  group: jobpoyt-job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Initialize run metrics
        id: init_metrics
        run: |
          summary_file="$RUNNER_TEMP/jobbot-run-summary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          echo "JOBBOT_RUN_SUMMARY_FILE=$summary_file" >> "$GITHUB_ENV"
          echo "JOBBOT_RUN_ID=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          JOBBOT_RUN_SUMMARY_FILE="$summary_file" JOBBOT_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" node scripts/runSummary.js init

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Install Chromium and system dependencies
        id: browser
        run: npx playwright install --with-deps chromium

      - name: Scrape continuously for 30 minutes
        id: scrape
        timeout-minutes: 31
        run: |
          window_seconds=1800
          deadline=$((SECONDS + window_seconds))
          cycle=0

          while (( SECONDS < deadline )); do
            cycle=$((cycle + 1))
            remaining=$((deadline - SECONDS))
            echo "Starting scraper cycle ${cycle}; ${remaining}s remain in the scraping window"

            set +e
            timeout --signal=TERM --kill-after=2s "${remaining}s" npm start
            status=$?
            set -e

            if (( status == 124 && SECONDS >= deadline )); then
              echo "30-minute scraping window completed"
              break
            fi

            if (( status != 0 )); then
              exit "$status"
            fi
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Publish execution summary
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOBBOT_SETUP_OUTCOME: ${{ steps.setup_node.outcome }}
          JOBBOT_INIT_OUTCOME: ${{ steps.init_metrics.outcome }}
          JOBBOT_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          JOBBOT_BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          JOBBOT_SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: node scripts/runSummary.js finalize
